<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vale of Emberglen</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #ui-root{position:fixed;inset:0;pointer-events:none;z-index:10}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#05070c;z-index:100;transition:opacity .6s}
  #boot.hidden{opacity:0;pointer-events:none}
  #boot h1{font-size:clamp(22px,4vw,40px);font-weight:300;letter-spacing:.22em;margin:0;
    text-transform:uppercase;color:#e8dcc0}
  #boot .bar{width:min(320px,60vw);height:2px;background:#ffffff22;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0%;background:#e8b45c;transition:width .3s}
  #boot small{color:#8a8f99;letter-spacing:.1em;font-size:11px}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>
  <div id="boot"><h1>Vale of Emberglen</h1><div class="bar"><i id="boot-bar"></i></div><small id="boot-msg">waking the vale…</small></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
